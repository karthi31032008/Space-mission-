
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SPACE MISSION - DARK GALAXY</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- GAME HUD -->
    <div id="hud">
        <h1>SPACE MISSION</h1>

        <div class="stats">
            <span>Score: <b id="score">0</b></span>
            <span>Health: <b id="health">100</b></span>
            <span>Level: <b id="level">1</b></span>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-container"></div>

    <!-- GAME MESSAGE -->
    <div id="message">
        <h2>DARK GALAXY</h2>
        <p>Explore the unknown universe</p>
        <button id="start-btn">START MISSION</button>
    </div>

    <!-- GAME CONTROLS -->
    <div id="help">
        WASD: Move |
        Mouse: Aim |
        Click: Shoot |
        Space: Jump
    </div>

    <!-- THREE JS GAME -->
    <script type="module" src="game.js"></script>

</body>
</html>
